# ── Bluetooth LE peripheral ──────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AcousticShield"
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_MAX_CONN=1

# Nordic UART Service (NUS) from nRF Connect SDK
CONFIG_BT_NUS=y

# The app negotiates MTU 247 so a 5-band MULTI_FILTER JSON fits in one write.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ── Buses to the ADAU1860 ───────────────────────────────────────────────────
# Control port is I2C by default; SPI enabled for the high-throughput
# program/coefficient download path (see boards/*.overlay).
CONFIG_I2C=y
CONFIG_SPI=y

# ── Runtime ─────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096

# strtof/printf of floats for JSON band parsing and logging
CONFIG_PICOLIBC=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ── Logging ─────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
