# Haven v3 slim pod: no 32.768 kHz crystal on the board (removed 2026-11-11 to make room for the cell),
# so the low-frequency clock runs from the internal RC oscillator, calibrated against the 32 MHz crystal.
# Build with -DFILE_SUFFIX=lfrc; the network core gets sysbuild/ipc_radio_lfrc.conf the same way.
# Cost: 250 ppm class accuracy, slightly higher radio current (wider receive windows). Not measured.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
