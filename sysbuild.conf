# nRF5340 is dual-core: the application core (this project, cpuapp) has no
# direct radio hardware — the Bluetooth LE controller lives on the network
# core (cpunet). This tells sysbuild to build and flash the standard NCS
# `hci_rpmsg` sample as the network-core image automatically, connected to
# our app's Bluetooth Host over IPC. Without this, CONFIG_BT=y in prj.conf
# has nothing to talk to and BLE will silently fail to come up.
#
# Requires building with sysbuild enabled: `west build --sysbuild ...`
# (see README.md).
SB_CONFIG_NETCORE_HCI_RPMSG=y
