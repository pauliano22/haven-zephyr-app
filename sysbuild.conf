# nRF5340 is dual-core: the application core (this project, cpuapp) has no
# direct radio hardware — the Bluetooth LE controller lives on the network
# core (cpunet). This tells sysbuild to build and flash the `ipc_radio`
# netcore image (NCS's unified net-core app, configured here for HCI
# serialization over IPC) automatically, connected to our app's Bluetooth
# Host over IPC. Without this, CONFIG_BT=y in prj.conf has nothing to talk
# to and BLE will silently fail to come up.
#
# NOTE: `hci_rpmsg` (the standalone sample this used to reference) was
# replaced by `ipc_radio` starting NCS 2.7 and no longer exists as of
# this repo's pinned v3.4.0 — see nrf/applications/ipc_radio and
# nrf/sysbuild/Kconfig.netcore.
#
# Requires building with sysbuild enabled: `west build --sysbuild ...`
# (see README.md).
SB_CONFIG_NETCORE_IPC_RADIO=y
SB_CONFIG_NETCORE_IPC_RADIO_BT_HCI_IPC=y
