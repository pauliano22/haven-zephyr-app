# Builds the app-core image for nRF5340 DK on every push to main (and PRs
# targeting it, so a break surfaces before merge, not after).
#
# NOTE: For C/Zephyr there's no separate "typecheck" phase distinct from
# compilation the way there is for TS — `west build` performing a full GCC
# compile of every translation unit *is* the type check. A green run means
# both "compiles" and "types are consistent" in one step.
#
# NOTE: this workflow was authored without access to a real NCS toolchain to
# verify against. The `nordicplayground/nrfconnect-sdk` container image below
# is the commonly-documented one for NCS app CI as of writing, but image
# names/tags do drift — if this fails on first run, check
# https://developer.nordicsemi.com/nRF_Connect_SDK/doc/latest/nrf/dm_config_and_build.html
# or the image's own registry page for the current tag before assuming the
# firmware code itself is at fault.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: nordicplayground/nrfconnect-sdk:main

    steps:
      - name: Checkout haven_zephyr_app
        uses: actions/checkout@v4
        with:
          path: haven_zephyr_app

      - name: Initialize west workspace
        run: |
          west init -l haven_zephyr_app
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Build (nRF5340 DK, application core + net-core hci_rpmsg via sysbuild)
        run: |
          west build \
            --board nrf5340dk/nrf5340/cpuapp \
            --sysbuild \
            --pristine \
            haven_zephyr_app

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-firmware-nrf5340dk
          path: |
            build/merged.hex
            build/haven_zephyr_app/zephyr/zephyr.elf
          if-no-files-found: warn
