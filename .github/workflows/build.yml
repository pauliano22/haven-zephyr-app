# Builds the app-core image for nRF5340 DK on every push to master (this
# repo's default branch — and PRs targeting it, so a break surfaces before
# merge, not after).
#
# NOTE: For C/Zephyr there's no separate "typecheck" phase distinct from
# compilation the way there is for TS — `west build` performing a full GCC
# compile of every translation unit *is* the type check. A green run means
# both "compiles" and "types are consistent" in one step.
#
# NOTE: originally used nordicplayground/nrfconnect-sdk:main, which is why
# CI was failing (build 32862318520/32864473134, "manifest unknown") --
# that image/repo was archived by Nordic in Dec 2024, its own README now
# points here instead: https://github.com/NordicPlayground/nrf-docker
# ghcr.io/zephyrproject-rtos/ci:v0.29.3 bundles Zephyr SDK 1.0.1, which
# matches the SDK version verified locally against this repo's pinned NCS
# v3.4.0 (west.yml) / Zephyr 4.4.0 -- see zephyrproject-rtos/docker-image's
# own release notes before bumping this tag, to keep that match.
name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.3

    steps:
      # persist-credentials: false is the actual fix for the two attempts
      # below it in git history -- actions/checkout@v4 injects its fetch
      # token via GIT_CONFIG_COUNT/GIT_CONFIG_KEY_n/GIT_CONFIG_VALUE_n
      # *environment variables*, not a gitconfig file, so `git config
      # --unset` (build 32869642761) can't touch it -- it persists across
      # every step in the job regardless, intercepting west's later
      # anonymous clone of the public nrfconnect/nrf repo with no TTY to
      # satisfy the resulting auth prompt ("could not read Username",
      # builds 32865090917 and 32869642761). Routing it through
      # GITHUB_TOKEN instead made it worse ("Repository not found", build
      # 32868435790) -- that token is scoped only to *this* repo. Telling
      # checkout not to persist credentials at all sidesteps every variant
      # of this at the source; nothing later in the job needs to
      # authenticate back to this repo.
      - name: Checkout haven_zephyr_app
        uses: actions/checkout@v4
        with:
          path: haven_zephyr_app
          persist-credentials: false

      # TEMP DIAGNOSTIC: three straight fixes for "could not read Username"
      # (unset the extraheader, persist-credentials: false, routing through
      # GITHUB_TOKEN) all failed identically or worse -- pointing away from
      # actions/checkout's credential injection as the actual cause. Before
      # guessing a fourth time, capture what's really configured. Remove
      # once the real cause is found.
      - name: DIAGNOSTIC - git/env state
        run: |
          echo "--- git config --list --show-origin ---"
          git config --list --show-origin || true
          echo "--- GIT_*/CI env vars ---"
          env | grep -E '^GIT_|^CI$|^GITHUB_ACTIONS$' || true
          echo "--- raw anonymous ls-remote (bypassing west) ---"
          git -c http.extraheader= ls-remote https://github.com/nrfconnect/nrf HEAD || true
          echo "--- git version ---"
          git --version

      - name: Initialize west workspace
        run: |
          west init -l haven_zephyr_app
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Build (nRF5340 DK, application core + net-core ipc_radio via sysbuild)
        run: |
          west build \
            --board nrf5340dk/nrf5340/cpuapp \
            --sysbuild \
            --pristine \
            haven_zephyr_app

      # No merged.hex: that's an MCUboot-merged-image convention and this
      # build has no bootloader (see sysbuild.conf) -- sysbuild instead
      # produces two independent per-core images, flashed separately
      # (`west flash --runner jlink`, verified locally).
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haven-firmware-nrf5340dk
          path: |
            build/haven_zephyr_app/zephyr/zephyr.hex
            build/haven_zephyr_app/zephyr/zephyr.elf
            build/ipc_radio/zephyr/zephyr.hex
          if-no-files-found: warn
