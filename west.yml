# West manifest for haven_zephyr_app as a standalone out-of-tree NCS
# application. Importing `nrf` pulls in the full nRF Connect SDK manifest
# (Zephyr, hal_nordic, etc.) at the pinned revision below, which is what lets
# `west init -l haven_zephyr_app` (see README.md) work without this repo
# vendoring any SDK code itself.
#
# NOTE: `revision` is pinned to the latest NCS release known at the time this
# file was written. Match it to whatever version nRF Connect for VS Code's
# Toolchain Manager actually installed on your machine (Toolchain Manager ->
# your install -> version string) before running `west update` — a mismatch
# won't fail loudly, it'll just fetch a different SDK version than the
# toolchain you have.
#
# NOTE: `repo-path: sdk-nrf` is required -- the actual GitHub repo is
# nrfconnect/sdk-nrf (renamed from fw-nrfconnect-nrf pre-NCS-1.3.0);
# `nrfconnect/nrf` hasn't existed for years. `name: nrf` still has to stay
# literally "nrf" though: that's what NCS's own manifest-import convention
# keys off of (`import: true` on a project named exactly `nrf`) and what
# the local checkout directory is named. Caught via CI (build 32871505752)
# — this was a real dormant bug, not a CI-environment issue: local builds
# never actually exercised this manifest from scratch, always pointing
# `west build` at a pre-existing NCS checkout set up via the official
# Toolchain Manager instead, which already used the correct path.
manifest:
  remotes:
    - name: ncs
      url-base: https://github.com/nrfconnect

  projects:
    - name: nrf
      repo-path: sdk-nrf
      remote: ncs
      revision: v3.4.0
      import: true

  self:
    path: haven_zephyr_app
